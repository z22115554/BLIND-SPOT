<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲區交接 BLIND SPOT</title>
<meta name="description" content="第一人稱程式化 WebGL 心理恐怖遊戲。零跳臉、純氣氛恐怖。">
<style>
  :root { --bg: #000; --fg: #d9d4c7; --dim: #8a857a; --accent: #d8b04a; --alert: #b3362c; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --fg: #d9d4c7; --dim: #8a857a; --accent: #d8b04a; --alert: #b3362c; } }
  :root[data-theme="dark"] { --bg: #000; --fg: #d9d4c7; --dim: #8a857a; --accent: #d8b04a; --alert: #b3362c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  #app, #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot-msg { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--bg); pointer-events: none;
    font: 14px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; letter-spacing: 0.4em; color: var(--dim);
    transition: opacity 0.6s ease; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<div id="boot-msg" role="status" aria-live="polite">載入中…</div>
